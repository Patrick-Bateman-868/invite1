<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Медина, одно предложение 🌆</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', 'Comic Sans MS', cursive, sans-serif;
            /* Спокойный, стильный градиент */
            background: linear-gradient(135deg, #d4c5f9 0%, #f9d9e6 50%, #c5e0f9 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Минималистичные маленькие сердечки */
        .hearts {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .heart {
            position: absolute;
            font-size: 14px; /* Стали заметно меньше */
            color: rgba(255, 255, 255, 0.5);
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-5vh) rotate(0deg);
                opacity: 0.6;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0;
            }
        }

        .container {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(15px);
            border-radius: 35px;
            padding: 45px 35px;
            box-shadow: 0 25px 55px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 480px;
            width: 90%;
            transition: all 0.4s ease;
            border: 1px solid rgba(255,255,255,0.5);
        }

        h1 {
            font-size: 2.5rem;
            color: #4a3f6b;
            text-shadow: 1px 1px 8px rgba(255,255,255,0.7);
            margin-bottom: 20px;
            font-weight: 650;
            letter-spacing: 1px;
        }

        .question {
            font-size: 1.6rem;
            color: #3d3560;
            margin-bottom: 35px;
            font-weight: 500;
            line-height: 1.4;
            text-shadow: 1px 1px 6px rgba(255,255,255,0.6);
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 35px;
            flex-wrap: wrap;
            position: relative;
        }

        .btn {
            padding: 16px 42px;
            font-size: 1.4rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 1px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 22px rgba(0,0,0,0.18);
            user-select: none;
        }

        .btn-yes {
            background: #b392f0;
            color: white;
        }
        .btn-yes:hover {
            transform: scale(1.06);
            box-shadow: 0 12px 28px rgba(179, 146, 240, 0.5);
            background: #c3a9f7;
        }

        .btn-no {
            background: #cbd5e0;
            color: #4a5568;
            position: relative;
            transition: left 0.08s ease, top 0.08s ease;
        }
        .btn-no:hover {
            background: #d1d9e6;
        }

        .place-section {
            display: none;
            margin-top: 25px;
        }

        .place-section h2 {
            color: #3d3560;
            font-size: 1.8rem;
            margin-bottom: 20px;
            font-weight: 600;
            text-shadow: 1px 1px 6px rgba(255,255,255,0.5);
        }

        .places {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        .place-btn {
            background: white;
            color: #4a3f6b;
            border: none;
            padding: 14px 32px;
            font-size: 1.2rem;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            width: 85%;
            max-width: 300px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.1);
            transition: all 0.3s;
            border: 1px solid rgba(255,255,255,0.7);
        }
        .place-btn:hover {
            background: #f7f1ff;
            transform: translateY(-3px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.18);
            color: #2d2645;
        }

        .final-message {
            display: none;
            font-size: 1.8rem;
            color: #3d3560;
            margin-top: 20px;
            font-weight: 600;
            text-shadow: 1px 1px 6px rgba(255,255,255,0.5);
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="hearts" id="heartsContainer"></div>

    <div class="container" id="mainContainer">
        <div id="inviteBlock">
            <h1>Медина ✨</h1>
            <div class="question">
                Слушай, я тут подумал...<br>
                Мы давно общаемся, и это круто.<br>
                Предлагаю выйти на новый уровень —<br>
                <strong>пойдём гулять?</strong><br>
                <span style="font-size: 1rem; opacity: 0.8;">(Это не вопрос, это приглашение, от которого сложно отказаться 😏)</span>
            </div>
            <div class="buttons">
                <button class="btn btn-yes" id="btnYes">Конечно, да! 🔥</button>
                <button class="btn btn-no" id="btnNo">Нет, я пас 🙈</button>
            </div>
        </div>

        <div class="place-section" id="placeSection">
            <h2>Отлично! Тогда выбери место 👇</h2>
            <div class="places">
                <button class="place-btn" data-place="Парк Победы">🌳 Парк Победы</button>
                <button class="place-btn" data-place="Набережная">🌊 Набережная</button>
                <button class="place-btn" data-place="Площадь">🏛 Площадь</button>
                <button class="place-btn" data-place="ТЦ Инфинити Молл">🛍 ТЦ Инфинити Молл</button>
            </div>
        </div>

        <div class="final-message" id="finalMessage">
            Спасибо за ответ! 😊<br>
            Я уточню время и напишу тебе.<br>
            <span style="font-size: 1.2rem;">Хорошего дня!</span>
        </div>
    </div>

    <script>
        // Генерация маленьких сердечек (уменьшено количество и размер)
        const heartsContainer = document.getElementById('heartsContainer');
        const heartSymbols = ['❤️', '✨', '💫', '🌸'];
        for (let i = 0; i < 18; i++) {
            const heart = document.createElement('span');
            heart.classList.add('heart');
            heart.innerHTML = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
            heart.style.left = Math.random() * 100 + '%';
            heart.style.animationDuration = (Math.random() * 7 + 6) + 's';
            heart.style.animationDelay = Math.random() * 6 + 's';
            heart.style.fontSize = (Math.random() * 14 + 10) + 'px'; // 10-24px
            heartsContainer.appendChild(heart);
        }

        const btnNo = document.getElementById('btnNo');
        const btnYes = document.getElementById('btnYes');
        const inviteBlock = document.getElementById('inviteBlock');
        const placeSection = document.getElementById('placeSection');
        const finalMessage = document.getElementById('finalMessage');
        const mainContainer = document.getElementById('mainContainer');

        function moveNoButton() {
            const maxX = window.innerWidth - btnNo.offsetWidth;
            const maxY = window.innerHeight - btnNo.offsetHeight;
            const randomX = Math.max(15, Math.floor(Math.random() * (maxX - 30)));
            const randomY = Math.max(15, Math.floor(Math.random() * (maxY - 30)));
            btnNo.style.position = 'fixed';
            btnNo.style.left = randomX + 'px';
            btnNo.style.top = randomY + 'px';
            // Добавим микро-вибрацию для реалистичности
            btnNo.style.transform = `rotate(${(Math.random() - 0.5) * 4}deg)`;
        }

        btnNo.addEventListener('mouseenter', moveNoButton);
        btnNo.addEventListener('mousemove', moveNoButton);
        btnNo.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveNoButton();
        });

        btnYes.addEventListener('click', () => {
            inviteBlock.style.display = 'none';
            placeSection.style.display = 'block';
            mainContainer.style.padding = '40px 25px';
        });

        const placeButtons = document.querySelectorAll('.place-btn');
        placeButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const chosenPlace = btn.getAttribute('data-place');
                placeSection.style.display = 'none';
                finalMessage.style.display = 'block';
                sendChoiceToTelegram(chosenPlace);
            });
        });

        function sendChoiceToTelegram(place) {
            const token = '8910613345:AAFh7cMX5OdTEk_ubhTPLtkvgFvuQhYlKGE';
            const chatId = '7551615312'; // ⚠️ СЮДА ВСТАВЬ СВОЙ ЧИСЛОВОЙ ID

            const message = `✅ Медина выбрала: ${place}`;

            if (chatId === 'YOUR_CHAT_ID') {
                alert('Тестовый режим: выбор не отправлен. Вставь свой chat_id!\n\nМедина выбрала: ' + place);
                console.log('Тест: ' + message);
                return;
            }

            const url = `https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}`;
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data.ok) {
                        console.log('✅ Отправлено в Telegram');
                    } else {
                        console.error('Ошибка Telegram API:', data);
                        alert('Не удалось отправить. Проверь chat_id.');
                    }
                })
                .catch(error => {
                    console.error('Ошибка сети:', error);
                    alert('Ошибка соединения.');
                });
        }
    </script>
</body>
</html>
